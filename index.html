<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analog Clock</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="clock">
        <div class="hand seconds"></div>

        <span class="num u1">1</span>
        <span class="num u2">2</span>
        <span class="num u3">3</span>
        <span class="num u4">4</span>
        <span class="num u5">5</span>
        <span class="num u6">6</span>
        <span class="num u7">7</span>
        <span class="num u8">8</span>
        <span class="num u9">9</span>
        <span class="num u10">10</span>
        <span class="num u11">11</span>
        <span class="num u12">12</span>
    </div>

</body>

</html>
